[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "world-model-demo"
version = "0.1.0"
description = "Interactive world model demonstrator for Gymnasium CarRacing-v3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[box2d]>=1.0,<2.0",
    "fastapi>=0.110,<1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.2",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
world_model = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
